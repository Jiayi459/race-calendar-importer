<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Race Calendar Importer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <div class="masthead">
          <div>
            <p class="eyebrow">URL to Apple Calendar</p>
            <h1>Race Calendar Importer</h1>
          </div>
          <button class="icon-button" id="sampleButton" type="button" title="Load sample events" aria-label="Load sample events">
            <span aria-hidden="true">+</span>
          </button>
        </div>

        <form class="url-form" id="urlForm">
          <label for="sourceUrl">Schedule URL</label>
          <div class="url-row">
            <input
              id="sourceUrl"
              name="sourceUrl"
              type="url"
              placeholder="https://www.fis-ski.com/..."
              autocomplete="url"
              required
            />
            <button type="submit">Extract</button>
          </div>
        </form>

        <div class="import-options" aria-label="Calendar options">
          <label>
            Calendar title
            <input id="calendarTitle" type="text" value="Race Calendar" />
          </label>
          <label>
            Default duration
            <select id="defaultDuration">
              <option value="60">1 hour</option>
              <option value="90">90 minutes</option>
              <option value="120" selected>2 hours</option>
              <option value="180">3 hours</option>
              <option value="1440">All day</option>
            </select>
          </label>
          <label>
            Reminder
            <select id="reminderMinutes">
              <option value="">None</option>
              <option value="30">30 minutes before</option>
              <option value="120" selected>2 hours before</option>
              <option value="1440">1 day before</option>
            </select>
          </label>
        </div>

        <div class="status-line" id="statusLine">Paste a schedule URL, extract dates, then download an Apple Calendar file.</div>
        <div class="download-fallback" id="downloadFallback" hidden></div>

        <section class="events-panel" aria-label="Extracted events">
          <div class="panel-header">
            <h2>Events</h2>
            <div class="actions">
              <button id="addEventButton" type="button">Add Event</button>
              <button id="downloadButton" class="primary" type="button" disabled>Download ICS</button>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Use</th>
                  <th>Title</th>
                  <th>Start</th>
                  <th>End</th>
                  <th>Location</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="eventsBody">
                <tr class="empty-row">
                  <td colspan="6">No events extracted yet.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <template id="eventRowTemplate">
      <tr>
        <td><input class="include-input" type="checkbox" checked /></td>
        <td><input class="title-input" type="text" /></td>
        <td><input class="start-input" type="datetime-local" /></td>
        <td><input class="end-input" type="datetime-local" /></td>
        <td><input class="location-input" type="text" /></td>
        <td><button class="remove-button" type="button" title="Remove event" aria-label="Remove event">×</button></td>
      </tr>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
